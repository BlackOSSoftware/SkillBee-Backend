# SkillBee Redis — cache only (MongoDB Atlas is source of truth)
bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 60
timeout 0

# Persistence for infrastructure reliability; cache values remain disposable
save 900 1
save 300 10
appendonly yes
appendfsync everysec

# Memory — override via container command / compose if needed
maxmemory 256mb
maxmemory-policy allkeys-lru

# Security: requirepass is injected via docker-compose command (--requirepass)
# Do not commit production passwords here.
